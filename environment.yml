# Conda environment used for this project.
# Create:  conda env create -f environment.yml
# Then:    conda activate stylometry
#
# For GPU (needed for stages C and I), replace the pinned torch below with the CUDA build
# from https://pytorch.org/get-started/locally/ - the run used torch 2.5.1+cu121.

name: stylometry
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas==3.0.3
      - numpy==2.4.6
      - scikit-learn==1.9.0
      - scipy==1.17.1
      - matplotlib==3.11.0
      - lightgbm==4.7.0
      - shap==0.51.0
      - gensim==4.4.0
      - transformers==5.14.1
      - torch==2.5.1
      - requests==2.34.2
      - python-dotenv==1.2.2
      - openpyxl==3.1.5
      - tqdm==4.68.4
